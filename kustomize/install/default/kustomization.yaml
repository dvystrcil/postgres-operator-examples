kind: Kustomization

namespace: postgres-operator

labels:
- includeSelectors: false
  includeTemplates: true
  pairs:
    app.kubernetes.io/name: pgo
    app.kubernetes.io/version: 5.8.4
- includeSelectors: true
  includeTemplates: true
  pairs:
    postgres-operator.crunchydata.com/control-plane: postgres-operator

resources:
- ../crd
- ../rbac/cluster
- ../manager
- pgo-harbor-pull-infisical-secret.yaml # homelab, argocd-projects#55

components:
- ../components/images-by-tag

patches:
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: pgo
    spec:
      template:
        spec:
          # homelab, argocd-projects#55: the operator image comes from Harbor.
          imagePullSecrets:
          - name: pgo-harbor-pull
          containers:
          - name: operator
            env:
            - name: PGO_FEATURE_GATES
              value: ""
