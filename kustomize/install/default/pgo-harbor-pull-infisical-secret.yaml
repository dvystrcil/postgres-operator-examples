# Homelab addition (argocd-projects#55): pull credentials for the operator's
# own image, harbor.sirddail.net/crunchy/postgres-operator.
#
# Same pattern as wallos-harbor-pull: rendered from the shared HB_* keys in
# homelab-bz-gt/prod (robot$k8s, pull rights on every Harbor project).
# creationPolicy Orphan so deleting this CR never takes the Secret with it.
#
# The operator does NOT copy this into the PostgresClusters; each cluster sets
# its own spec.imagePullSecrets. harbor-postgres pins upstream digests and
# never pulls from Harbor, and its StatefulSets recreate lost pods without the
# operator, so Harbor being down never strands Harbor's own database.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: pgo-harbor-pull
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  hostAPI: http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: homelab-bz-gt
        envSlug: prod
        secretsPath: "/"
        recursive: false
      credentialsRef:
        secretName: infisical-machine-identity
        secretNamespace: infisical-operator
  managedKubeSecretReferences:
  - secretName: pgo-harbor-pull
    secretNamespace: postgres-operator
    secretType: kubernetes.io/dockerconfigjson
    creationPolicy: "Orphan"
    template:
      includeAllSecrets: false
      data:
        ".dockerconfigjson": '{"auths":{"{{ .HB_REGISTRY.Value }}":{"username":"{{ .HB_USERNAME.Value }}","password":"{{ .HB_PASSWORD.Value }}","auth":"{{ .HB_AUTH.Value }}"}}}'
