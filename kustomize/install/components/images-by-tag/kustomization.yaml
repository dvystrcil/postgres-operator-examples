kind: Component
# argocd-projects#55: the RELATED_IMAGE_* defaults the homelab runs are served
# from the private Harbor project `crunchy` (byte-identical crane copies of the
# upstream digests; Crunchy's free registry stops updating 2026-12-31 and has
# deleted tags before). The operator image stays upstream, pinned by digest
# (see its entry). pgadmin4, PG15 and PostGIS stay upstream because nothing uses
# them and they were never copied. Copy one into Harbor before switching it here.
images:
- name: image-pgadmin
  newName: registry.developers.crunchydata.com/crunchydata/crunchy-pgadmin4
  newTag: ubi9-9.8-2542
- name: image-pgbackrest
  newName: harbor.sirddail.net/crunchy/crunchy-pgbackrest
  newTag: ubi9-2.56.0-2542
- name: image-pgbouncer
  newName: harbor.sirddail.net/crunchy/crunchy-pgbouncer
  newTag: ubi9-1.24-2542
- name: image-postgres-exporter
  newName: harbor.sirddail.net/crunchy/crunchy-postgres-exporter
  newTag: ubi9-0.17.1-2542
# The operator itself stays upstream, pinned by digest: on a fresh cluster PGO
# has to start before harbor-postgres exists, so it cannot need Harbor
# (argocd-projects#55). Same digest as the Harbor copy. The tag is kept for
# readability. This name also feeds RELATED_IMAGE_COLLECTOR.
