kind: Component
# argocd-projects#55: every image the homelab runs is served from the private
# Harbor project `crunchy` (byte-identical crane copies of the upstream digests;
# Crunchy's free registry stops updating 2026-12-31 and has deleted tags before).
# The rest (pgadmin4, PG15, PostGIS) stay upstream because nothing uses them and
# they were never copied. Copy one into Harbor before switching it here.
images:
- name: image-pgadmin
  newName: registry.developers.crunchydata.com/crunchydata/crunchy-pgadmin4
  newTag: ubi9-9.8-2542
